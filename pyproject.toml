[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcos-litwatch"
version = "0.1.0"
description = "Stdlib PCOS literature collector: PubMed, ClinicalTrials.gov, arXiv. Optional Postgres sink."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Justin Wilson" }]
keywords = ["pubmed", "clinicaltrials", "arxiv", "pcos", "literature", "agents"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]
postgres = ["psycopg2-binary>=2.9"]

[project.scripts]
pcos-litwatch = "pcos_litwatch.cli:main"

[project.urls]
Homepage = "https://github.com/jwilson411/pcos-litwatch"
Source = "https://github.com/jwilson411/pcos-litwatch"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pcos_litwatch = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Existing code is exempted rather than reflowed/rewritten; new files are held to the full rule set.
[tool.ruff.lint.per-file-ignores]
"src/pcos_litwatch/backfill.py" = ["E501", "B905"]
"src/pcos_litwatch/cli.py" = ["E501"]
"src/pcos_litwatch/collect.py" = ["E501"]
"src/pcos_litwatch/heuristic.py" = ["E501"]
"src/pcos_litwatch/http.py" = ["E501"]
"src/pcos_litwatch/pubmed.py" = ["E501"]
"src/pcos_litwatch/store.py" = ["E501", "B905"]
"src/pcos_litwatch/trials.py" = ["E501"]
"tests/test_heuristic.py" = ["E501"]
