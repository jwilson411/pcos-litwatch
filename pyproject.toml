[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcos-litwatch"
version = "0.1.0"
description = "Stdlib PCOS literature collector: PubMed, ClinicalTrials.gov, arXiv. Optional Postgres sink."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Justin Wilson" }]
keywords = ["pubmed", "clinicaltrials", "arxiv", "pcos", "literature", "agents"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
postgres = ["psycopg2-binary>=2.9"]

[project.scripts]
pcos-litwatch = "pcos_litwatch.cli:main"

[project.urls]
Homepage = "https://github.com/jwilson411/pcos-litwatch"
Source = "https://github.com/jwilson411/pcos-litwatch"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
